[project]
name = "auto-backup-extension"
version = "0.0.0"
description = "Intégration Home Assistant « Auto Backup », étendue aux destinations Dropbox et Google Drive."
readme = "README.md"
# Plancher unique du projet : `hacs.json` annonce Home Assistant 2026.3.0 aux
# utilisateurs, et Home Assistant >= 2026.3 exige Python >= 3.14.2. Le même
# interpréteur vaut donc en développement et chez les utilisateurs ; c'est ce que
# vérifie `tests/test_compatibilite_python.py`, qui dérive son plancher d'analyse
# de la version déclarée dans `hacs.json`.
requires-python = ">=3.14.2"
# Dépendances utilisées par l'intégration `custom_components/auto_backup`.
# `homeassistant` fournit aussi aiohttp, voluptuous et slugify, importés par l'intégration.
dependencies = [
    "aiofiles>=24.1.0",
    "homeassistant>=2026.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    # Épingle `homeassistant` et la boîte à outils de test du cœur de Home Assistant :
    # c'est cette dépendance qui fixe la version de Home Assistant testée.
    "pytest-homeassistant-custom-component>=0.13.363",
    "ruff>=0.16.8",
]

[tool.uv]
# Le dépôt est une intégration Home Assistant chargée depuis `custom_components/`,
# pas une distribution Python à construire ni à installer.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# La couverture de `custom_components/auto_backup` est mesurée et affichée à chaque
# exécution (critère d'acceptation de l'issue #4) ; `-p no:cacheprovider` évite
# d'écrire un cache pytest dans le dépôt.
addopts = "-p no:cacheprovider --cov=custom_components/auto_backup --cov-report=term-missing"
markers = [
    "network: test nécessitant un accès réseau (GitHub via le CLI `gh`) ; ignoré sauf si `--tests-reseau` est passé.",
]

[tool.ruff]
# `target-version` décrit l'interpréteur de **développement** (cf. `requires-python`).
# Il coïncide aujourd'hui avec celui des utilisateurs : le plancher annoncé dans
# `hacs.json` (Home Assistant 2026.3) exige Python 3.14. Le code livré dans
# `custom_components/` doit rester analysable par un interpréteur 3.14, sans quoi
# l'intégration lèverait une `SyntaxError` au chargement chez ces utilisateurs — les
# deux planchers ne sont pas liés, le dépôt suivant la dernière version de Home
# Assistant alors que celui annoncé ne bouge que sur décision explicite.
# `tests/test_compatibilite_python.py` veille sur cette règle, documentée dans
# `docs/tests.md` (section « Compatibilité Python »).
target-version = "py314"
line-length = 88
# Racines d'imports du dépôt. `tests/` en fait partie : pytest l'ajoute à
# `sys.path`, les modules d'aide des tests (`destinations_factices`) sont donc du
# code du dépôt et non des dépendances tierces pour le tri des imports.
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Les modules listés ici sont importés à l'identique depuis l'upstream
# (cf. docs/UPSTREAM.md) : seules les règles de correction (pyflakes, erreurs de
# syntaxe et de logique) s'y appliquent, les règles de style sont neutralisées
# pour ne pas diverger de l'upstream et garder les resynchronisations lisibles.
# Ils sont énumérés un par un, et non couverts par un motif du type
# `custom_components/auto_backup/*.py` : dans les motifs de `ruff`, `*` traverse
# les séparateurs de chemin, et un tel motif exempterait aussi le code propre au
# fork rangé dans `custom_components/auto_backup/destinations/`, qui doit rester
# soumis à toutes les règles et au formatage. `tests/test_project_tooling.py`
# vérifie que cette liste correspond exactement aux modules upstream livrés.
"custom_components/auto_backup/__init__.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"custom_components/auto_backup/binary_sensor.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"custom_components/auto_backup/button.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"custom_components/auto_backup/config_flow.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"custom_components/auto_backup/const.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"custom_components/auto_backup/handlers.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"custom_components/auto_backup/helpers.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"custom_components/auto_backup/manager.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]
"custom_components/auto_backup/sensor.py" = ["E501", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
# Même raison : le code upstream n'est pas reformaté, celui du fork l'est.
exclude = [
    "custom_components/auto_backup/__init__.py",
    "custom_components/auto_backup/binary_sensor.py",
    "custom_components/auto_backup/button.py",
    "custom_components/auto_backup/config_flow.py",
    "custom_components/auto_backup/const.py",
    "custom_components/auto_backup/handlers.py",
    "custom_components/auto_backup/helpers.py",
    "custom_components/auto_backup/manager.py",
    "custom_components/auto_backup/sensor.py",
]
